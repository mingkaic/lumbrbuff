<!DOCTYPE html>
<html>
<head>
    <title>Lumbrstreams</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; }
        .ERROR { color: #f44336; font-weight: bold; }
        .INFO { color: #4caf50; }
        table { width: 100%; border-collapse: collapse; }
        td, th { padding: 8px; border-bottom: 1px solid #333; text-align: left; }
        .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
          background: #2d2d2d; padding: 10px; border-radius: 4px; }
        .toolbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
        input, select, button { background: #3c3c3c; color: #d4d4d4; border: 1px solid #555;
          padding: 6px 10px; border-radius: 3px; }
        button:hover { background: #4a4a4a; cursor: pointer; }
        .danger-btn { background: #b91c1c; color: white; border: 1px solid #991b1b;
          font-weight: bold; margin-left: 10px; }
        .danger-btn:hover { background: #dc2626; cursor: pointer; }
        .danger-btn:disabled { background: #7f1d1d; cursor: not-allowed; opacity: 0.6; }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>
<body>
    <h2>Lumbrbuff Streams</h2>
    <div class="toolbar">
      <div class="toolbar-left">
        <label for="end-time">End-time:</label>
        <input type="datetime-local" step="1" id="end-time" style="padding: 6px;">
        <input type="text" id="payload-search-input"
          placeholder="Search log by pattern..." style="padding: 8px; width: 250px;">
        <button id="refresh-btn" style="padding: 8px; cursor: pointer;">Refresh Logs</button>
      </div>
      <div class="toolbar-right">
        <label for="limit-select">Show:</label>
        <select id="limit-select" style="padding: 6px;">
            <option value="50" selected>50</option>
            <option value="100">100</option>
            <option value="250">250</option>
        </select>
        <button id="delete-btn" class="danger-btn">Delete Logs (including not shown)</button>
      </div>
    </div>
    <table id="log-table">
        <tr><th>Time</th><th>Level</th><th>Source</th><th>Message</th></tr>
    </table>

    <script>
        const fpConfig = {
            enableTime: true,
            dateFormat: "Y-m-d H:i:S", // 24-hour format with seconds
            time_24hr: true,           // Forces 24-hour mode
            enableSeconds: true,
            defaultDate: new Date(),   // Sets default to "Now"
        };
        const endPicker = flatpickr("#end-time", fpConfig);

        const table = document.getElementById('log-table');
        const refreshBtn = document.getElementById('refresh-btn');
        const endTimeInput = document.getElementById('end-time');
        const limitSelect = document.getElementById('limit-select');
        const searchInput = document.getElementById('payload-search-input');
        const deleteBtn = document.getElementById('delete-btn');

        function addLogRow(data) {
            const row = table.insertRow(-1);
            row.className = data.severity;
            const localTime = new Date(data.timestamp).toLocaleString(undefined, {
              year: 'numeric', month: '2-digit', day: '2-digit',
              hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false})
            row.innerHTML = `<td>${localTime}</td><td>${data.severity}</td>
                             <td>${data.file}:${data.line}</td><td>${data.message}</td>`;
        }

        function clearTable() {
          while (table.rows.length > 1) {
            table.deleteRow(1);
          }
        }

        function addLogs() {

          let query = [
            "limit="+limitSelect.value
          ];

          const endtimeValue = endTimeInput.value;
          if (endtimeValue) {
            const endtime = new Date(endtimeValue)
            query.push("before="+endtime.toISOString());
          }

          const searchValue = searchInput.value;
          if (searchValue) {
            query.push("search="+searchValue);
          }

          refreshBtn.disabled = true;
          refreshBtn.innerText = "Getting Logs...";

          clearTable();
          fetch('/logs' + "?" + query.join("&"))
            .then(response => response.json())
            .then(logs => {
              if (logs) {
                logs.forEach(log => addLogRow(log))
              }
            })
            .catch(err => console.error("Error fetching logs:", err))
            .finally(() => {
              refreshBtn.disabled = false;
              refreshBtn.innerText = "Refresh Logs";
            });
        }

        refreshBtn.addEventListener('click', addLogs);

        deleteBtn.addEventListener('click', function() {
          if (!confirm("Are you sure you want to permanently delete all logs?")) {
            return;
          }
          deleteBtn.disabled = true;
          deleteBtn.innerText = "Deleting...";

          let query = []
          const endtimeValue = endTimeInput.value;
          if (endtimeValue) {
            const endtime = new Date(endtimeValue)
            query.push("before="+endtime.toISOString());
          }

          fetch('/logs' + (query ? "?" + query.join("&") : ""), {
            method: 'DELETE', headers: { 'Content-Type': 'application/json' }
          })
            .then((response) => {
              if (response.ok) {
                alert("Logs deleted successfully.");
                clearTable();
              } else {
                throw new Error("Server failed to delete logs.");
              }
            })
            .catch(err => console.error("Error deleting logs:", err))
            .finally(() => {
              deleteBtn.disabled = false;
              deleteBtn.innerText = "Delete All Logs";
            });
        });

        addLogs()
    </script>
</body>
</html>
